name: Android standalone Demo APK
on:
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-demo-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - name: Install the locked SDK 58 / React Native 0.88 Android toolchain
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - run: npm run check:android-config
      - run: npx expo install --check
        env:
          EXPO_OFFLINE: "1"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build embedded-JS Demo APK using public debug signing only
        run: npm run build:android:demo
      - name: Inspect the actual APK
        run: bash scripts/verify-android-demo.sh
      - uses: actions/upload-artifact@v4
        with:
          name: helperday-demo-apk-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: artifacts/
      - name: Record build validation boundary
        run: |
          echo 'Standalone Demo APK assembled and inspected; no Expo account or Supabase project was used.' >> "$GITHUB_STEP_SUMMARY"
          echo 'See the emulator job for runtime evidence. Physical phone testing remains UNVERIFIED.' >> "$GITHUB_STEP_SUMMARY"
  emulator:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: helperday-demo-apk-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/smoke-android-demo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: helperday-demo-emulator-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          path: artifacts/emulator/
          if-no-files-found: warn
