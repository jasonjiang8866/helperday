name: Android preview APK
run-name: Android preview APK · ${{ github.ref_name }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: android-preview
    env:
      EXPO_NO_DOTENV: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: node scripts/check-android-preview.mjs --project-only
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build signed APK using existing EAS project, environment and keystore
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo "::error::Set EXPO_TOKEN in the android-preview GitHub environment. See docs/android-preview.md."
            exit 1
          fi
          npm run build:android:preview
      - name: Verify APK signature, package, launcher and callback scheme
        run: bash scripts/verify-android-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: helperday-android-preview-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            artifacts/helperday-preview.apk
            artifacts/helperday-preview.apk.sha256
            artifacts/build-manifest.json
            artifacts/apk-signature.txt
            artifacts/apk-badging.txt
            artifacts/apk-android-manifest.txt
      - name: Record validation boundary
        shell: bash
        run: |
          echo "Signed APK signature/package checks passed for $GITHUB_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo "Installation, email delivery/cold and warm callbacks, SecureStore and two-device tests: UNVERIFIED. Follow docs/android-preview.md." >> "$GITHUB_STEP_SUMMARY"
